<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🎂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#fff}
body{display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain;background:#000}
</style>
</head>
<body>
<video id="v" autoplay playsinline preload="auto" style="width:100%;height:100%;object-fit:contain">
<source src="https://github.com/dylle1/chenchen-birthday/releases/download/v1.0/chenchen-birthday.mp4" type="video/mp4">
</video>
<script>
var v=document.getElementById('v');
v.play().catch(function(){
  v.muted=true;
  v.play();
});
v.addEventListener('canplay',function(){
  if(v.muted){
    setTimeout(function(){
      v.muted=false;
      v.play().catch(function(){});
    },500);
  }
});
document.documentElement.addEventListener('touchstart',function(){},false);
document.documentElement.addEventListener('click',function(){
  v.muted=false;
  v.play();
},false);
</script>
</body>
</html>
